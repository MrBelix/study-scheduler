# CI: run unit + integration tests on pushes and PRs to main.
# Deployment is handled by Dokploy (builds the Dockerfile on push to main) — no deploy job here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.Tests/StudyScheduler.Tests.csproj --configuration Release

  integration:
    name: Integration tests (Aspire + PostgreSQL)
    runs-on: ubuntu-latest # ubuntu runners ship a running Docker daemon that Aspire uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.IntegrationTests/StudyScheduler.IntegrationTests.csproj --configuration Release
