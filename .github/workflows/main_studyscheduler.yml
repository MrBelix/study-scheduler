# CI/CD: unit + integration tests gate the deploy; on green main the deploy job
# calls Dokploy's deploy webhook (exposed via Traefik at /api/deploy), which
# builds the Dockerfile on the server. Dokploy's own push-webhook autodeploy
# must stay OFF, or pushes would deploy without waiting for tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.Tests/StudyScheduler.Tests.csproj --configuration Release

  integration:
    name: Integration tests (Aspire + PostgreSQL)
    runs-on: ubuntu-latest # ubuntu runners ship a running Docker daemon that Aspire uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.IntegrationTests/StudyScheduler.IntegrationTests.csproj --configuration Release

  deploy:
    name: Deploy to Dokploy
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"