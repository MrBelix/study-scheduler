# CI/CD: unit + integration tests gate the deploy; on green main the deploy job
# calls Dokploy API (exposed at deploy.belix.dev via Traefik, /api path only),
# which builds the Dockerfile on the server. Dokploy's GitHub-App autodeploy
# can't reach the private panel, so this pipeline is the only deploy trigger.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.Tests/StudyScheduler.Tests.csproj --configuration Release

  integration:
    name: Integration tests (Aspire + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/StudyScheduler.IntegrationTests/StudyScheduler.IntegrationTests.csproj --configuration Release

  deploy:
    name: Deploy to Dokploy
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        uses: thinesjs/dokploy-deployer-action@v1
        with:
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          api_key: ${{ secrets.DOKPLOY_API_KEY }}
          type: application
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          wait_for_deployment: true
          deployment_timeout: 600